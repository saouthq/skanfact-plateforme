<title>Maquette SkanFact Charte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap">
<style>
:root {
  --fond: #eef1f5;
  --papier: #ffffff;
  --papier-2: #f7f9fb;
  --barre-fond: #f3f5f8;
  --survol: rgba(27, 36, 48, .055);
  --actif-fond: #ffffff;
  --actif-ombre: 0 1px 2px rgba(27, 36, 48, .08), 0 0 0 1px rgba(27, 36, 48, .06);
  --encre: #1b2430;
  --gris: #5b6675;
  --gris-2: #6b7685;
  --trait: #e6eaf0;
  --trait-fort: #d3d9e2;
  --sarcelle: #0f9d8f;
  --sarcelle-f: #0c877b;
  --sarcelle-texte: #0b7a70;
  --doux: #e6f5f3;
  --doux-texte: #0b6b62;
  --ambre-doux: #fff4e3; --ambre-texte: #a4520b; --ambre: #e8890c;
  --rouge-doux: #fdecea; --rouge-texte: #b4231d; --rouge: #d2413b;
  --orange: #e5533d;
  --cadre-tel: #11151b;

  --ombre-forte: 0 1px 3px rgba(20, 40, 60, .06), 0 24px 60px -20px rgba(20, 40, 60, .22);
  --ombre-pop: 0 0 0 1px rgba(27, 36, 48, .06), 0 12px 32px -8px rgba(20, 40, 60, .22), 0 4px 10px -4px rgba(20, 40, 60, .08);
  --voile: rgba(17, 24, 33, .36);
  --police: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #0d1015; --papier: #1a2029; --papier-2: #151a21; --barre-fond: #12161c; --survol: rgba(230, 234, 240, .06);
    --actif-fond: #232b36; --actif-ombre: 0 0 0 1px rgba(230, 234, 240, .06);
    --encre: #e6eaf0; --gris: #a3adbb; --gris-2: #7d8898; --trait: #2a3340; --trait-fort: #3b4656;
    --sarcelle: #1fb8a8; --sarcelle-f: #26cbba; --sarcelle-texte: #4fd3c4; --doux: #14302e; --doux-texte: #7fe0d3;
    --ambre-doux: #3a2c1c; --ambre-texte: #f0b06a; --rouge-doux: #3a2224; --rouge-texte: #f4938d;
    --cadre-tel: #05070a; --ombre: none; --ombre-forte: 0 24px 60px -20px rgba(0, 0, 0, .6); --ombre-pop: 0 0 0 1px #2a3340, 0 16px 40px -10px rgba(0, 0, 0, .6);
    --voile: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #0d1015; --papier: #1a2029; --papier-2: #151a21; --barre-fond: #12161c; --survol: rgba(230, 234, 240, .06);
  --actif-fond: #232b36; --actif-ombre: 0 0 0 1px rgba(230, 234, 240, .06);
  --encre: #e6eaf0; --gris: #a3adbb; --gris-2: #7d8898; --trait: #2a3340; --trait-fort: #3b4656;
  --sarcelle: #1fb8a8; --sarcelle-f: #26cbba; --sarcelle-texte: #4fd3c4; --doux: #14302e; --doux-texte: #7fe0d3;
  --ambre-doux: #3a2c1c; --ambre-texte: #f0b06a; --rouge-doux: #3a2224; --rouge-texte: #f4938d;
  --cadre-tel: #05070a; --ombre: none; --ombre-forte: 0 24px 60px -20px rgba(0, 0, 0, .6); --ombre-pop: 0 0 0 1px #2a3340, 0 16px 40px -10px rgba(0, 0, 0, .6);
  --voile: rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font-family: var(--police); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sarcelle); outline-offset: 2px; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font-family: var(--police); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sarcelle); outline-offset: 2px; }
[hidden] { display: none !important; }
.page { padding-inline: 16px; padding-block: 28px 60px; max-width: 1720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.tete { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end; }
.tete-txt { display: grid; gap: 6px; max-width: 760px; }
.surtitre { font-size: 12.5px; font-weight: 600; color: var(--sarcelle-texte); }
h1 { margin: 0; font-size: clamp(28px, 3vw, 38px); letter-spacing: -.03em; line-height: 1.1; text-wrap: balance; }
.tete-txt p { margin: 0; color: var(--gris); max-width: 70ch; }
.reglages { display: grid; gap: 10px; }
.reg-l { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.reg-l > b { font-size: 12px; color: var(--gris-2); width: 64px; }
.segment { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--papier); border: 1px solid var(--trait); border-radius: 12px; }
.segment button { border: 0; background: none; padding: 6px 11px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--gris); cursor: pointer; }
.segment button[aria-pressed="true"] { background: var(--encre); color: var(--papier); }
.inter { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border: 1px solid var(--trait); border-radius: 99px; background: var(--papier); font-size: 13px; font-weight: 500; color: var(--gris); cursor: pointer; }
.inter i { width: 28px; height: 16px; border-radius: 99px; background: var(--trait-fort); position: relative; }
.inter i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 99px; background: #fff; transition: transform .2s; }
.inter[aria-pressed="true"] { color: var(--encre); }
.inter[aria-pressed="true"] i { background: var(--sarcelle); }
.inter[aria-pressed="true"] i::after { transform: translateX(12px); }
.scene { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
.ordi-boite { flex: 1 1 100%; min-width: 0; overflow-x: auto; border-radius: 16px; }
.ordi { min-width: 1400px; height: 860px; display: flex; border-radius: 16px; overflow: hidden; background: var(--papier-2); border: 1px solid var(--trait); box-shadow: var(--ombre-forte); position: relative; }
/* la barre, en résumé : la même que la maquette de la barre */
.barre { width: 222px; flex: none; background: var(--barre-fond); border-right: 1px solid var(--trait); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; }
.marque { display: flex; gap: 10px; align-items: center; padding: 4px 6px 10px; }
.marque-s { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; background: linear-gradient(145deg, #1fb8a8, #0c877b); flex: none; }
.marque b { font-size: 14px; display: block; line-height: 1.2; }
.marque small { font-size: 12px; color: var(--gris-2); }
.creer { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 10px; background: var(--sarcelle); color: #fff; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
.lien { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 9px; border-radius: 9px; color: var(--gris); font-size: 14px; font-weight: 500; }
.lien.on { background: var(--actif-fond); box-shadow: var(--actif-ombre); color: var(--encre); font-weight: 600; }
.lien.on svg { color: var(--sarcelle); }
.lien .n { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 0 6px; border-radius: 6px; background: var(--ambre-doux); color: var(--ambre-texte); }
.barre .sec { font-size: 11.5px; color: var(--gris-2); font-weight: 600; padding: 10px 9px 2px; }
/* la page */
.contenu { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.haut { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 14px; padding: 14px 24px; background: color-mix(in srgb, var(--papier-2) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--trait); }
.haut .titre { display: grid; gap: 1px; min-width: 0; }
.chemin { font-size: 12.5px; color: var(--gris-2); display: flex; gap: 6px; align-items: center; }
.chemin a { color: inherit; text-decoration: none; }
.haut h2 { margin: 0; font-size: 21px; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.statut { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--survol); color: var(--gris); white-space: nowrap; }
.statut.ok { background: var(--doux); color: var(--doux-texte); }
.statut.attire { background: var(--ambre-doux); color: var(--ambre-texte); }
.statut.alerte { background: var(--rouge-doux); color: var(--rouge-texte); }
.statut.bleu { background: color-mix(in srgb, #4d7cf2 16%, var(--papier)); color: #3559c7; }
.garde { font-size: 12.5px; color: var(--gris-2); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.garde svg { color: var(--doux-texte); }
.haut .gestes { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--trait); background: var(--papier); font-weight: 600; font-size: 13.5px; color: var(--encre); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--trait-fort); }
.btn.prem { background: var(--sarcelle); border-color: transparent; color: #fff; box-shadow: 0 1px 2px rgba(12,135,123,.3); }
.btn.prem:hover { background: var(--sarcelle-f); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.mini { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.lien-b { border: 0; background: none; padding: 0; height: auto; color: var(--sarcelle-texte); }
.btn.danger { color: var(--rouge-texte); }
kbd { font-family: var(--police); font-size: 10.5px; font-weight: 600; padding: 0 5px; border-radius: 4px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); opacity: .85; }
.corps { flex: 1; min-height: 0; overflow: auto; padding: 18px 24px 28px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.gauche { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.droite { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; }
.carte { background: var(--papier); border: 1px solid var(--trait); border-radius: 14px; box-shadow: var(--ombre); }
.bloc { padding: 16px 18px; display: grid; gap: 12px; }
.bloc-t { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.bloc-t h3 { margin: 0; font-size: 14.5px; letter-spacing: -.01em; }
.bloc-t small { color: var(--gris-2); font-size: 12.5px; }
/* bandeaux */
.bandeau { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; font-size: 13.5px; }
.bandeau > svg { flex: none; }
.bandeau .txt { flex: 1; display: grid; gap: 1px; }
.bandeau .txt span { color: var(--gris); font-size: 13px; }
.bandeau.info { background: color-mix(in srgb, #4d7cf2 9%, var(--papier)); border: 1px solid color-mix(in srgb, #4d7cf2 22%, transparent); }
.bandeau.info > svg { color: #3559c7; }
.bandeau.ambre { background: var(--ambre-doux); border: 1px solid color-mix(in srgb, var(--ambre) 30%, transparent); }
.bandeau.ambre > svg { color: var(--ambre-texte); }
.bandeau.gris { background: var(--survol); }
.bandeau.rouge { background: var(--rouge-doux); }
.bandeau.rouge > svg { color: var(--rouge-texte); }
/* le client */
.client { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.av { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; }
.client-n { display: grid; gap: 2px; min-width: 0; }
.client-n b { font-size: 16px; letter-spacing: -.01em; }
.client-n span { font-size: 12.5px; color: var(--gris-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.client-g { display: flex; gap: 6px; }
.client-faits { display: flex; flex-wrap: wrap; gap: 8px; }
.fait { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 10px; border-radius: 9px; background: var(--survol); color: var(--gris); }
.fait b { color: var(--encre); font-weight: 600; }
.fait.alerte { background: var(--rouge-doux); color: var(--rouge-texte); }
.fait.alerte b { color: var(--rouge-texte); }
.fait.ok { background: var(--doux); color: var(--doux-texte); }
.fait.attire { background: var(--ambre-doux); color: var(--ambre-texte); }
.fait.attire b { color: var(--ambre-texte); }
.fait a { color: inherit; font-weight: 600; }
.chercher { display: grid; gap: 8px; }
.champ-cl { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 11px; border: 1.5px solid var(--sarcelle); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sarcelle) 14%, transparent); background: var(--papier); color: var(--gris-2); }
.curseur { width: 1.5px; height: 18px; background: var(--sarcelle); animation: cligne 1s steps(1) infinite; }
@keyframes cligne { 50% { opacity: 0; } }
.propos { border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; }
.propos button { width: 100%; display: flex; gap: 10px; align-items: center; padding: 9px 12px; border: 0; border-top: 1px solid var(--trait); background: var(--papier); text-align: left; cursor: pointer; }
.propos button:first-child { border-top: 0; background: var(--survol); }
.propos button span:not(.av) { display: grid; flex: 1; }
.propos button small { color: var(--gris-2); font-size: 12px; }
.propos .av { width: 30px; height: 30px; font-size: 11px; border-radius: 9px; }
.propos .nouveau { color: var(--sarcelle-texte); font-weight: 600; }
/* l'essentiel : dates, objet ; et les réglages en étiquettes */
.essentiel { display: grid; grid-template-columns: 150px 210px minmax(0, 1fr); gap: 10px; }
.ch { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--gris-2); }
.ch .v { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 11px; border: 1px solid var(--trait-fort); border-radius: 9px; background: var(--papier); font-size: 14px; font-weight: 500; color: var(--encre); white-space: nowrap; overflow: hidden; }
.ch .v small { color: var(--gris-2); font-weight: 500; }
.ch .v.vide { color: var(--gris-2); }
.ch .v.requis { border-color: var(--ambre); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ambre) 18%, transparent); }
.etiquettes { display: flex; flex-wrap: wrap; gap: 6px; }
.etq { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--trait); background: var(--papier); font-size: 12.5px; color: var(--gris); cursor: pointer; }
.etq b { color: var(--encre); font-weight: 600; }
.etq.vide { border-style: dashed; }
.etq.chg { border-color: color-mix(in srgb, var(--sarcelle) 50%, var(--trait)); background: var(--doux); color: var(--doux-texte); }
.etq.chg b { color: var(--doux-texte); }
/* les lignes */
.outils { display: flex; gap: 8px; align-items: center; }
.ajout { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--trait-fort); color: var(--gris-2); font-size: 13.5px; }
.ajout kbd { margin-left: auto; }
.lignes { display: grid; }
.lg { display: grid; grid-template-columns: 22px minmax(0, 1fr) 62px 70px 96px 66px 62px 104px 30px; gap: 8px; align-items: center; padding: 8px 4px; border-top: 1px solid var(--trait); }
.lignes.fodec .lg { grid-template-columns: 22px minmax(0, 1fr) 62px 70px 96px 66px 62px 52px 104px 30px; }
.lg.t { border-top: 0; font-size: 11.5px; font-weight: 600; color: var(--gris-2); padding-block: 0 6px; letter-spacing: .02em; }
.lg .m, .lg.t .m { text-align: right; }
.lg .prise { color: var(--trait-fort); cursor: grab; display: flex; }
.lg .des { display: grid; gap: 2px; min-width: 0; }
.lg .des b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg .des small { font-size: 12px; color: var(--gris-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg .des .info { display: flex; gap: 8px; font-size: 11.5px; color: var(--gris-2); }
.lg .des .info .ok { color: var(--doux-texte); }
.lg .des .info .alerte { color: var(--rouge-texte); }
.in { height: 34px; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; border-radius: 8px; border: 1px solid transparent; background: var(--survol); font-variant-numeric: tabular-nums; font-size: 13.5px; width: 100%; min-width: 0; text-align: right; }
.in.g { justify-content: flex-start; text-align: left; }
input.in { outline: none; }
input.in:focus { border-color: var(--sarcelle); background: var(--papier); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sarcelle) 15%, transparent); }
.in.r { color: var(--doux-texte); font-weight: 600; }
.lg .tot { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.lg .tot small { display: block; font-size: 11px; font-weight: 500; color: var(--gris-2); }
.lg .neg { color: var(--rouge-texte); }
.lg .plus { border: 0; background: none; color: var(--gris-2); cursor: pointer; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
.lg .plus:hover { background: var(--survol); }
.lg.fige .in { background: transparent; }
.chk { width: 16px; height: 16px; accent-color: var(--sarcelle); margin: 0 auto; display: block; }
.pied-l { display: flex; align-items: center; gap: 12px; padding-top: 10px; border-top: 1px solid var(--trait); }
.pied-l .aide { font-size: 12px; color: var(--gris-2); }
.pied-l .rg { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gris); }
.pied-l .rg .in { width: 70px; }
.vide-l { display: grid; justify-items: center; gap: 6px; padding: 26px; text-align: center; color: var(--gris); font-size: 13.5px; }
.vide-l b { color: var(--encre); font-size: 15px; }
.deux-b { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.zone { border: 1.5px dashed var(--trait-fort); border-radius: 12px; padding: 14px; display: flex; gap: 10px; align-items: center; color: var(--gris); font-size: 13px; }
.zone svg { color: var(--gris-2); flex: none; }
.note-z { min-height: 70px; border: 1px solid var(--trait-fort); border-radius: 10px; padding: 10px 12px; color: var(--gris-2); font-size: 13.5px; }
.note-z.plein { color: var(--encre); }
/* la colonne de droite */
.totaux { padding: 16px 18px; display: grid; gap: 7px; }
.tl { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--gris); font-variant-numeric: tabular-nums; }
.tl b { color: var(--encre); font-weight: 600; }
.tl.sep { border-top: 1px solid var(--trait); padding-top: 8px; margin-top: 2px; }
.tl.sous { font-size: 12.5px; padding-left: 10px; }
.tl.neg b { color: var(--rouge-texte); }
.net { margin-top: 6px; padding: 14px; border-radius: 12px; background: var(--doux); display: grid; gap: 2px; }
.net span { font-size: 12.5px; font-weight: 600; color: var(--doux-texte); }
.net b { font-size: 28px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--encre); }
.net b small { font-size: 14px; color: var(--gris); font-weight: 600; }
.net em { font-style: normal; font-size: 11.5px; color: var(--gris); }
.actions-d { padding: 14px; display: grid; gap: 8px; }
.actions-d .btn.prem { height: 44px; justify-content: center; font-size: 14.5px; }
.actions-d .rang { display: flex; gap: 6px; }
.actions-d .rang .btn { flex: 1 1 0; min-width: 0; padding: 0 8px; justify-content: center; height: 34px; font-size: 13px; }
.actions-d .av-geste { font-size: 12px; color: var(--gris-2); margin: 0; }
.verif { padding: 12px 14px; display: grid; gap: 7px; font-size: 12.5px; }
.verif b { font-size: 12.5px; }
.verif .l { display: flex; gap: 8px; align-items: center; color: var(--gris); }
.verif .l svg { flex: none; }

/* ---------- le kit commun : une seule façon de faire, sur chaque page ---------- */

.pop-menu button { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 7px 9px; border: 0; background: none; border-radius: 8px; cursor: pointer; font: inherit; color: inherit; }

/* Le toast : en bas, sombre, 6 secondes ; « Annuler » seulement quand le geste se défait. */
.toast { overflow: hidden; }

@keyframes temps-toast { from { width: 100%; } to { width: 0; } }

  }
  $('charte').innerHTML = page();
