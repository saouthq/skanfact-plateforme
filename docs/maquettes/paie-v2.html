<title>Paie au quotidien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap">
<style>
:root {
  --fond: #eef1f5; --papier: #ffffff; --papier-2: #f7f9fb; --barre: #f3f5f8; --survol: rgba(27, 36, 48, .055);
  --actif-ombre: 0 1px 2px rgba(27, 36, 48, .08), 0 0 0 1px rgba(27, 36, 48, .06);
  --encre: #1b2430; --gris: #5b6675; --gris-2: #6b7685; --trait: #e6eaf0; --trait-fort: #d3d9e2;
  --sarcelle: #0f9d8f; --sarcelle-f: #0c877b; --sarcelle-texte: #0b7a70; --doux: #e6f5f3; --doux-texte: #0b6b62;
  --ambre-doux: #fff4e3; --ambre-texte: #a4520b; --ambre: #e8890c;
  --rouge-doux: #fdecea; --rouge-texte: #b4231d; --rouge: #d2413b;
  --bleu-doux: #eaf1fd; --bleu-texte: #2459b8;
  --ombre: 0 1px 2px rgba(20, 40, 60, .04), 0 6px 20px rgba(20, 40, 60, .05);
  --ombre-pop: 0 0 0 1px rgba(27, 36, 48, .06), 0 12px 32px -8px rgba(20, 40, 60, .22), 0 4px 10px -4px rgba(20, 40, 60, .08);
  --voile: rgba(17, 24, 33, .36); --cadre-tel: #11151b;
  --police: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #0d1015; --papier: #1a2029; --papier-2: #151a21; --barre: #12161c; --survol: rgba(230, 234, 240, .06);
    --actif-ombre: 0 0 0 1px rgba(230, 234, 240, .08);
    --encre: #e6eaf0; --gris: #a3adbb; --gris-2: #7d8898; --trait: #2a3340; --trait-fort: #3b4656;
    --sarcelle: #1fb8a8; --sarcelle-f: #26cbba; --sarcelle-texte: #4fd3c4; --doux: #14302e; --doux-texte: #7fe0d3;
    --ambre-doux: #3a2c1c; --ambre-texte: #f0b06a; --rouge-doux: #3a2224; --rouge-texte: #f4938d;
    --bleu-doux: #1c2940; --bleu-texte: #8db4f4;
    --ombre: none; --ombre-pop: 0 0 0 1px #2a3340, 0 16px 40px -10px rgba(0, 0, 0, .6); --voile: rgba(0, 0, 0, .55); --cadre-tel: #05070a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #0d1015; --papier: #1a2029; --papier-2: #151a21; --barre: #12161c; --survol: rgba(230, 234, 240, .06);
  --actif-ombre: 0 0 0 1px rgba(230, 234, 240, .08);
  --encre: #e6eaf0; --gris: #a3adbb; --gris-2: #7d8898; --trait: #2a3340; --trait-fort: #3b4656;
  --sarcelle: #1fb8a8; --sarcelle-f: #26cbba; --sarcelle-texte: #4fd3c4; --doux: #14302e; --doux-texte: #7fe0d3;
  --ambre-doux: #3a2c1c; --ambre-texte: #f0b06a; --rouge-doux: #3a2224; --rouge-texte: #f4938d;
  --bleu-doux: #1c2940; --bleu-texte: #8db4f4;
  --ombre: none; --ombre-pop: 0 0 0 1px #2a3340, 0 16px 40px -10px rgba(0, 0, 0, .6); --voile: rgba(0, 0, 0, .55); --cadre-tel: #05070a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font-family: var(--police); font-size: 14px; line-height: 1.45; font-feature-settings: 'cv11', 'ss01'; }
button { font: inherit; color: inherit; cursor: pointer; }
b, strong { font-weight: 600; }
.m { font-variant-numeric: tabular-nums; }

/* ── le bandeau de la maquette (hors application) ── */
.mq { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--encre); color: var(--papier); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--encre); }
.mq h1 { font-size: 14px; margin: 0; font-weight: 650; }
.mq .grp { display: flex; gap: 6px; align-items: center; font-size: 12.5px; opacity: .92; }
.mq .grp > span { opacity: .7; }
.mq .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 9px; background: rgba(255,255,255,.12); }
.mq .seg button { border: 0; background: none; border-radius: 7px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: inherit; opacity: .8; }
.mq .seg button.on { background: var(--papier); color: var(--encre); opacity: 1; }
.mq .lien { margin-left: auto; border: 1px solid rgba(255,255,255,.3); background: none; border-radius: 8px; padding: 4px 10px; font-size: 12.5px; }

/* ── la coquille de l'application ── */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 48px); }
.nav { background: var(--barre); border-right: 1px solid var(--trait); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav .ent { display: flex; gap: 9px; align-items: center; font-weight: 650; padding: 4px 6px 12px; }
.nav .ent i { width: 28px; height: 28px; border-radius: 8px; background: var(--sarcelle); color: #fff; font-style: normal; font-size: 12px; display: grid; place-items: center; }
.nav a { display: flex; gap: 10px; align-items: center; padding: 7px 9px; border-radius: 8px; color: var(--encre); text-decoration: none; font-size: 14px; }
.nav a.on { background: var(--papier); box-shadow: var(--actif-ombre); font-weight: 600; }
.nav a small { margin-left: auto; background: var(--ambre-doux); color: var(--ambre-texte); border-radius: 99px; padding: 0 7px; font-size: 11.5px; font-weight: 700; }
.nav .t { font-size: 11.5px; color: var(--gris-2); padding: 12px 9px 4px; }
.page { padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; width: 100%; margin: 0 auto; min-width: 0; }
.chemin { font-size: 12.5px; color: var(--gris); }
.chemin a { color: inherit; text-decoration: none; }
.chemin a:hover { text-decoration: underline; }
.tete { display: flex; gap: 12px 20px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin: 4px 0 16px; }
.tete h2 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
.tete .sous { color: var(--gris); margin-top: 2px; }
.tete .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--trait-fort); background: var(--papier); border-radius: 9px; padding: 8px 13px; font-weight: 600; font-size: 13.5px; display: inline-flex; gap: 7px; align-items: center; }
.btn:hover { background: var(--papier-2); }
.btn.p { background: var(--sarcelle); border-color: var(--sarcelle); color: #fff; }
.btn.p:hover { background: var(--sarcelle-f); }
.btn.s { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.g { border-color: transparent; background: none; color: var(--gris); }
.btn:disabled { opacity: .45; cursor: default; }
.ico { width: 16px; height: 16px; flex: none; }

/* onglets : noirs ; filtres : gris (Skander, 03/11/2026) */
.onglets { display: inline-flex; gap: 2px; padding: 3px; background: var(--papier); border: 1px solid var(--trait); border-radius: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.onglets button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-weight: 500; color: var(--gris); display: inline-flex; gap: 6px; align-items: center; }
.onglets button.on { background: var(--encre); color: var(--papier); }
.onglets small { font-size: 11.5px; opacity: .75; font-weight: 600; }
.filtre { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--survol); flex-wrap: wrap; }
.filtre button { border: 0; background: none; border-radius: 8px; padding: 5px 9px; font-size: 12.5px; font-weight: 600; color: var(--gris); }
.filtre button.on { background: var(--papier); color: var(--encre); box-shadow: var(--actif-ombre); }
.filtre button.on.abs { color: var(--rouge-texte); }
.filtre button.on.cg { color: var(--bleu-texte); }
.filtre button.on.mal { color: var(--ambre-texte); }

.carte { background: var(--papier); border: 1px solid var(--trait); border-radius: 14px; box-shadow: var(--ombre); margin-bottom: 14px; min-width: 0; }
.carte > h3, .carte .h { margin: 0; padding: 14px 16px 10px; font-size: 15px; font-weight: 650; display: flex; gap: 8px 10px; align-items: baseline; flex-wrap: wrap; }
.carte .h small, .carte > h3 small { color: var(--gris); font-weight: 400; font-size: 13px; }
.carte .h .d { margin-left: auto; }
.pied > .btn { margin-left: auto; }
.pied { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--trait); color: var(--gris); font-size: 13px; }
.grille2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; align-items: start; }

.bandeau { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.bandeau.ambre { background: var(--ambre-doux); color: var(--ambre-texte); }
.bandeau.vert { background: var(--doux); color: var(--doux-texte); }
.bandeau .txt { flex: 1 1 300px; display: grid; gap: 1px; }
.bandeau .txt span { color: var(--encre); opacity: .8; font-size: 13px; }
.bandeau .btn { margin-left: auto; }

.av { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; flex: none; }
.ligne { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--trait); flex-wrap: wrap; }
.ligne .qui { flex: 1 1 140px; min-width: 0; display: grid; gap: 1px; }
.ligne .qui small { color: var(--gris); font-size: 12.5px; }
.ligne .fin { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.detail { flex-basis: 100%; display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; padding: 8px 0 2px 46px; font-size: 13px; color: var(--gris); }
.detail input, .detail select, .champ input, .champ select { font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--trait-fort); border-radius: 8px; background: var(--papier); color: var(--encre); }
.detail input.n { width: 74px; text-align: right; }
.pas { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--papier-2); color: var(--gris); border: 1px solid var(--trait); white-space: nowrap; }
.pas.vert { background: var(--doux); color: var(--doux-texte); border-color: transparent; }
.pas.ambre { background: var(--ambre-doux); color: var(--ambre-texte); border-color: transparent; }
.pas.rouge { background: var(--rouge-doux); color: var(--rouge-texte); border-color: transparent; }
.pas.bleu { background: var(--bleu-doux); color: var(--bleu-texte); border-color: transparent; }
.vide { padding: 18px 16px; color: var(--gris); display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--trait); }
.muet { color: var(--gris); }
.petit { font-size: 12.5px; }

/* gestes rapides */
.gestes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.geste { border: 1px solid var(--trait); background: var(--papier); border-radius: 12px; padding: 12px; text-align: left; display: grid; gap: 4px; box-shadow: var(--ombre); }
.geste:hover { border-color: color-mix(in srgb, var(--sarcelle) 45%, var(--trait)); }
.geste b { display: flex; gap: 8px; align-items: center; }
.geste span { color: var(--gris); font-size: 12.5px; }

/* le chemin du mois : quatre étapes, chacune s'ouvre */
.chemin-m { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 0 16px 16px; }
.etape { border: 1px solid var(--trait); border-radius: 12px; padding: 12px; text-align: left; background: var(--papier); display: grid; gap: 4px; position: relative; }
.etape .n { width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--papier-2); color: var(--gris); border: 1px solid var(--trait-fort); }
.etape b { font-size: 14px; }
.etape span { font-size: 12.5px; color: var(--gris); }
.etape.fait .n { background: var(--sarcelle); color: #fff; border-color: var(--sarcelle); }
.etape.cours { border-color: var(--sarcelle); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sarcelle) 15%, transparent); }
.etape.cours .n { color: var(--sarcelle-texte); border-color: var(--sarcelle); }
.etape.retard { border-color: color-mix(in srgb, var(--rouge) 50%, var(--trait)); }
.etape.retard .n { background: var(--rouge-doux); color: var(--rouge-texte); border-color: transparent; }
.etape.ouverte { background: var(--papier-2); }
.etape.ouverte::after { content: ""; position: absolute; left: 50%; bottom: -17px; width: 12px; height: 12px; background: var(--papier); border-left: 1px solid var(--trait); border-top: 1px solid var(--trait); transform: translateX(-50%) rotate(45deg); }

/* la grille du pointage du mois */
.gr { overflow-x: auto; padding: 0 16px 12px; }
.gr table { border-collapse: separate; border-spacing: 2px; font-size: 11.5px; }
.gr th { font-weight: 600; color: var(--gris-2); padding: 2px; text-align: center; min-width: 24px; }
.gr th.nom { text-align: left; min-width: 150px; color: var(--encre); font-size: 13px; }
.gr td.c { width: 26px; height: 26px; border-radius: 6px; text-align: center; font-weight: 700; background: var(--papier-2); color: var(--gris-2); cursor: pointer; }
.gr td.c.p, .gr td.c.hs { background: var(--doux); color: var(--doux-texte); }
.gr td.c.hs { outline: 2px solid var(--sarcelle); outline-offset: -2px; }
.gr td.c.a { background: var(--rouge-doux); color: var(--rouge-texte); }
.gr td.c.cg { background: var(--bleu-doux); color: var(--bleu-texte); }
.gr td.c.ml { background: var(--ambre-doux); color: var(--ambre-texte); }
.gr td.c.r { background: var(--ambre-doux); color: var(--ambre-texte); outline: 2px solid var(--ambre); outline-offset: -2px; }
.gr td.c.we { background: none; color: var(--trait-fort); cursor: default; }
.gr td.c.fu { background: none; border: 1px dashed var(--trait-fort); }
.gr td.t { padding-left: 10px; white-space: nowrap; color: var(--gris); font-size: 12px; }
.legende { display: flex; gap: 6px 14px; flex-wrap: wrap; padding: 0 16px 12px; font-size: 12px; color: var(--gris); }
.legende i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }

table.liste { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.liste th { text-align: left; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--gris-2); font-weight: 600; padding: 8px 12px; border-top: 1px solid var(--trait); background: var(--papier-2); white-space: nowrap; }
table.liste td { padding: 10px 12px; border-top: 1px solid var(--trait); vertical-align: middle; }
table.liste .r { text-align: right; }
table.liste tfoot td { font-weight: 650; background: var(--papier-2); }
table.liste input.n { width: 86px; text-align: right; font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--trait-fort); border-radius: 7px; background: var(--papier); color: var(--encre); }
.scroll { overflow-x: auto; }
.chiffres { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--trait); }
.chiffres > div { padding: 12px 16px; display: grid; gap: 2px; }
.chiffres > div + div { border-left: 1px solid var(--trait); }
.chiffres span { font-size: 12.5px; color: var(--gris); }
.chiffres b { font-size: 19px; font-variant-numeric: tabular-nums; }

/* l'équipe */
.equipe { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.sal { background: var(--papier); border: 1px solid var(--trait); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: left; box-shadow: var(--ombre); }
.sal:hover { border-color: color-mix(in srgb, var(--sarcelle) 45%, var(--trait)); }
.sal .h1 { display: flex; gap: 10px; align-items: center; }
.sal .h1 div { display: grid; min-width: 0; }
.sal .h1 small { color: var(--gris); }
.sal dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.sal dt { color: var(--gris); }
.sal dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

/* la fenêtre */
.voile { position: fixed; inset: 0; background: var(--voile); z-index: 40; display: grid; place-items: center; padding: 16px; }
.fen { background: var(--papier); border-radius: 16px; box-shadow: var(--ombre-pop); width: min(620px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
.fen .fh { padding: 18px 20px 6px; display: flex; gap: 10px; align-items: flex-start; }
.fen .fh h4 { margin: 0; font-size: 18px; flex: 1; }
.fen .fh .x { border: 0; background: none; font-size: 20px; color: var(--gris); line-height: 1; }
.fen .fc { padding: 6px 20px 14px; overflow: auto; display: grid; gap: 12px; }
.fen .ff { padding: 12px 20px; border-top: 1px solid var(--trait); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.champ { display: grid; gap: 4px; font-size: 13px; }
.champ > span { color: var(--gris); font-weight: 500; }
.champ input, .champ select { width: 100%; padding: 8px 10px; font-size: 14px; }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choix { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.choix button { border: 1px solid var(--trait); border-radius: 11px; background: var(--papier); padding: 10px; text-align: left; display: grid; gap: 2px; }
.choix button.on { border-color: var(--sarcelle); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sarcelle) 15%, transparent); }
.choix button span { color: var(--gris); font-size: 12px; }
.etapes-f { display: flex; gap: 6px; font-size: 12.5px; color: var(--gris); }
.etapes-f span { padding: 2px 9px; border-radius: 99px; background: var(--papier-2); }
.etapes-f span.on { background: var(--doux); color: var(--doux-texte); font-weight: 600; }
.calc { background: var(--papier-2); border-radius: 12px; padding: 12px; display: grid; gap: 6px; font-size: 13.5px; }
.calc div { display: flex; justify-content: space-between; gap: 10px; }
.calc .tot { border-top: 1px solid var(--trait); padding-top: 6px; font-weight: 650; }
.doc { border: 1px solid var(--trait); border-radius: 8px; padding: 18px; background: #fff; color: #1b2430; font-size: 12.5px; display: grid; gap: 8px; }
.doc h5 { margin: 0; text-align: center; font-size: 14px; letter-spacing: .06em; }
.doc .pt { border-bottom: 1px dotted #9aa3af; min-width: 80px; display: inline-block; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--encre); color: var(--papier); padding: 10px 14px; border-radius: 10px; z-index: 60; display: flex; gap: 12px; align-items: center; font-size: 13.5px; box-shadow: var(--ombre-pop); width: max-content; max-width: calc(100% - 32px); }
.toast button { border: 1px solid rgba(255,255,255,.35); background: none; color: inherit; border-radius: 7px; padding: 3px 9px; font-size: 12.5px; }

/* la note de conception, à droite des écrans */
.note { border-left: 3px solid var(--sarcelle); background: var(--papier); border-radius: 0 12px 12px 0; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; color: var(--gris); box-shadow: var(--ombre); }
.note b { color: var(--encre); }
.note ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; }

/* le téléphone */
.tel-fond { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; padding: 24px 16px 60px; }
.tel { width: 375px; max-width: 100%; border-radius: 38px; background: var(--cadre-tel); padding: 12px; box-shadow: var(--ombre-pop); }
.tel .ecr { background: var(--fond); border-radius: 28px; height: 760px; overflow: auto; position: relative; }
.tel .th { position: sticky; top: 0; z-index: 2; background: var(--papier); padding: 14px 14px 10px; border-bottom: 1px solid var(--trait); display: grid; gap: 2px; }
.tel .th b { font-size: 18px; }
.tel .th span { font-size: 12.5px; color: var(--gris); }
.tel .corps { padding: 12px; display: grid; gap: 10px; }
.tel .tc { background: var(--papier); border: 1px solid var(--trait); border-radius: 14px; }
.tel .tl { padding: 12px; border-top: 1px solid var(--trait); display: grid; gap: 8px; }
.tel .tl:first-child { border-top: 0; }
.tel .tl .q { display: flex; gap: 10px; align-items: center; }

function ouvrirMois(m, etape) { S.fiche = null; S.onglet = 'mois'; S.vueMois = m; S.etape = etape; if (S.ecran === 'tel') S.telOnglet = 'mois'; render(); window.scrollTo({ top: 0 }); }

function joindre(id) { S.regle['cert:' + id] = true; render(); toast(`Certificat joint (exemple) : rangé dans les documents ${id === 'ah' ? 'd\'Ahmed' : `de ${prenom(SAL.find(s => s.id === id))}`}`, () => { delete S.regle['cert:' + id]; }); }
function validerJour(d) {
  S.valide[d] = true;
  const n = SAL.filter(s => !pointeuse(s) && change(etatDe(s, d))).length;
  const auj = d === S.jour;
  S.jourVu = S.jour; S.feuille = null;
  render(); toast(`${auj ? 'Journée validée' : `${cap(NOMJ[JOURS[d - 1].w])} ${d}/11 validé`} · ${n ? n + ' changement' + (n > 1 ? 's' : '') : 'tout le monde était là'}${auj ? '' : ' · retour à aujourd\'hui'}`, () => { S.valide[d] = false; S.jourVu = d; });
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, a, td[data-case], [data-fermer-feuille]'); if (!t) return;
  const d = t.dataset;
  if (t.tagName === 'A') e.preventDefault();
  if (d.fermerFeuille !== undefined) { if (t.classList.contains('voile-t') && e.target !== t) return; S.feuille = null; render(); return; }
  if (d.m) { S.moment = d.m; S.onglet = 'jour'; initMoment(); render(); return; }
  if (d.t) { S.taille = d.t; S.onglet = S.fiche ? 'equipe' : S.onglet; initMoment(); render(); return; }
  if (d.e) { S.ecran = d.e; S.feuille = null; render(); return; }
  if (t.id === 'mq-pourquoi') return fenPourquoi();
  if (d.fermer !== undefined) return fermer();
  if (d.onglet) { S.onglet = d.onglet; S.fiche = null; S.etape = null; render(); return; }
  if (d.tel) { S.telOnglet = d.tel; if (d.vueTel) S.vueMois = d.vueTel; S.feuille = null; render(); return; }
  if (d.telRegle !== undefined) { S.ecran = 'ordi'; ouvrirMois('nov', 1); return; }
  if (d.feuille) { S.feuille = d.feuille; render(); return; }
  if (d.pres) { const [id, k] = d.pres.split(':'); setEtat(id, k); S.focus = S.feuille ? null : id; render(); return; }
  if (d.plus) { const [id, k] = d.plus.split(':'); basculer(id, k); S.focus = S.feuille ? null : id; render(); return; }
  if (d.motif) { const [id, k] = d.motif.split(':'); const dd = S.jourVu; S.pres[dd] = S.pres[dd] || {}; S.pres[dd][id] = Object.assign({}, etatDe(SAL.find(x => x.id === id), dd), { motif: k }); S.focus = S.feuille ? null : id; render(); return; }
  if (d.motifFen) { const [id, dd, k] = d.motifFen.split(':'); const n = Number(dd); S.pres[n] = S.pres[n] || {}; S.pres[n][id] = Object.assign({}, etatDe(SAL.find(x => x.id === id), n), { motif: k }); fermer(); render(); toast(`${prenom(SAL.find(x => x.id === id))}, le ${n}/11 : ${k === 'sans' ? 'absence sans solde' : 'absence justifiée, payée'}`, () => { delete S.pres[n][id].motif; }); return; }
  if (d.certif) return joindre(d.certif);
  if (d.case) { const [id, dd] = d.case.split(':'); const n = Number(dd); const s = SAL.find(x => x.id === id); if (pointeuse(s)) return fenBadge(id, n); if (S.valide[n]) return fen(`${s.nom} · ${NOMJ[JOURS[n - 1].w]} ${n}/11`, `<p style="margin:0">Ce jour-là : <b>${change(etatDe(s, n)) ? cap(libelle(etatDe(s, n))) : 'là, à ses horaires'}</b>.</p><p class="muet" style="margin:0">La journée est validée : rien ne s'y change sans la rouvrir. Rouvrir garde la trace de la première validation.</p>`, `<button class="btn" data-fermer>Fermer</button><button class="btn p" data-rouvrir="${n}">Rouvrir la journée du ${n}/11</button>`); S.focus = id; return voirJour(n); }
  if (d.badge) { const [id, dd] = d.badge.split(':'); return fenBadge(id, Number(dd)); }
  if (d.jour) { S.jourVu = Number(d.jour); render(); return; }
  if (d.sem) { const j = JOURS[S.jourVu - 1]; const lun = S.jourVu - ((j.w + 6) % 7); S.jourVu = Number(d.sem) < 0 ? Math.max(2, lun - 3) : Math.min(S.jour, lun + 7); if (JOURS[S.jourVu - 1].we) S.jourVu -= JOURS[S.jourVu - 1].w === 0 ? 2 : 1; render(); return; }
  if (d.eq) { const E = EQUIPES[d.eq]; const ouv = S.ouvertes[d.eq] !== undefined ? S.ouvertes[d.eq] : (E.main && SAL.some(s => s.eq === d.eq && change(etatDe(s, S.jourVu)))); S.ouvertes[d.eq] = !ouv; render(); return; }
  if (d.vider !== undefined) { S.cherche = ''; render(); return; }
  if (d.rouvrir) { const n = Number(d.rouvrir); fermer(); S.valide[n] = false; voirJour(n); toast(`${n === S.jour ? 'Journée' : `Le ${n}/11`} rouverte : corrige, puis valide à nouveau`); return; }
  if (d.regle) { const x = aRegler().find(y => y.cle === d.regle); if (x) x.go(); return; }
  if (t.id === 'principal') return principal()[2]();
  if (t.id === 'valider-jour') return validerJour(S.jourVu);
  if (d.accepte || d.refuse) {
    const id = d.accepte || d.refuse; const q = S.demandes.find(x => x.id === id); const i = S.demandes.indexOf(q); const s = SAL.find(x => x.id === q.s);
    S.demandes = S.demandes.filter(x => x.id !== id);
    if (d.accepte && q.type === 'conge' && q.s === 'sa') S.prevusAjoutes.push({ s: 'sa', du: 30, au: 30, note: 'accepté aujourd\'hui' });
    render();
    toast(d.refuse ? `Refusé · dis-le à ${prenom(s)}` : q.type === 'conge' ? `Congé accepté · il est sur ses jours dans le pointage de ${prenom(s)}` : q.type === 'avance' ? 'Avance acceptée · elle sera retenue sur novembre' : `Attestation prête · dans la fiche ${prenom(s) === 'Ines' ? 'd\'Ines' : 'de ' + prenom(s)}`, () => { S.demandes.splice(i, 0, q); S.prevusAjoutes = S.prevusAjoutes.filter(x => !(x.s === q.s && x.note === 'accepté aujourd\'hui')); });
    return;
  }
  if (d.tard) { const r = S.rappels.find(x => x.id === d.tard); const i = S.rappels.indexOf(r); S.rappels = S.rappels.filter(x => x.id !== d.tard); render(); toast('Je te le remontre lundi matin', () => { S.rappels.splice(i, 0, r); }); return; }
  if (d.rappel) { const r = S.rappels.find(x => x.id === d.rappel); if (r) r.go(); return; }
  if (d.vue) { S.vueMois = d.vue; S.etape = null; render(); return; }
  if (d.etape) { S.etape = Number(d.etape); render(); return; }
  if (t.id === 'valider-bulletins') { S.mois.bulletins = true; S.mois.pointageValide = true; S.etape = 3; render(); toast(`${SAL.length} bulletins de novembre validés`, () => { S.mois.bulletins = false; S.mois.pointageValide = false; }); return; }
  if (t.id === 'marquer-payes') { const o = S.vueMois === 'oct' ? S.oct : S.mois; o.payes = true; S.etape = 4; render(); toast(`Salaires ${S.vueMois === 'oct' ? 'd\'octobre' : 'de novembre'} payés · la trésorerie les voit`, () => { o.payes = false; }); return; }
  if (t.id === 'declarer') { const o = S.vueMois === 'oct' ? S.oct : S.mois; o.declare = true; S.rappels = S.rappels.filter(x => x.id !== 'r5'); render(); toast('Déclaration marquée déposée', () => { o.declare = false; }); return; }
  if (d.fiche) return fiche(d.fiche);
  if (d.retour !== undefined) { S.fiche = null; S.onglet = 'equipe'; render(); return; }
  if (t.id === 'rib') { const s = SAL.find(x => x.id === S.fiche); s.rib = true; S.rappels = S.rappels.filter(x => x.id !== 'r3'); render(); toast('RIB d\'Ahmed enregistré'); return; }
  if (d.geste) {
    if (d.geste === 'embaucher') { embEtape = 1; return fenEmbaucher(); }
    if (d.geste === 'absence') return fenAbsence();
    if (d.geste === 'avance') return fenAvance();
    if (d.geste === 'demande') return fenDemande();
    if (d.geste === 'document') { docChoix = 0; return fenDocument(); }
    if (d.geste === 'depart' || d.geste === 'renouveler') return fenDepart();
    if (d.geste === 'plus') return fen('Plus', `<div class="choix">${[['Les réglages', 'taux, horaires, équipes, jours fériés'], ['L\'historique', 'les mois passés, l\'année'], ['Importer', 'des salariés, la pointeuse'], ['Qui fait ma paie ?', 'toi, ton comptable, ou à deux'], ['Qui pointe ?', 'les chefs d\'équipe et leur droit']].map(([a, b]) => `<button type="button"><b>${a}</b><span>${b}</span></button>`).join('')}</div>`, '<button class="btn" data-fermer>Fermer</button>');
  }
  if (d.doc) { docChoix = Number(d.doc); return fenDocument(); }
  if (t.id === 'emb-suiv') { if (embEtape < 3) { embEtape++; return fenEmbaucher(); } fermer(); toast('Nour Mansour ajoutée à l\'équipe · son contrat est prêt à signer'); return; }
  if (t.id === 'emb-prec') { embEtape--; return fenEmbaucher(); }
  if (t.id === 'ok-fen') { fermer(); if (d.rappelFait) S.rappels = S.rappels.filter(x => x.id !== d.rappelFait); if (d.regleFait) S.regle[d.regleFait] = true; render(); toast(d.msg); return; }
});
document.addEventListener('input', e => { if (e.target.id === 'cherche') { S.cherche = e.target.value; S.focusCherche = true; render(); } });
document.addEventListener('change', e => {
  const t = e.target, dd = S.jourVu;
  const k = t.dataset.min ? 'retard' : t.dataset.hs ? 'hs' : null; if (!k) return;
  const id = t.dataset.min || t.dataset.hs, n = Math.max(0, Number(String(t.value).replace(',', '.')) || 0);
  S.pres[dd] = S.pres[dd] || {}; S.pres[dd][id] = Object.assign({}, etatDe(SAL.find(x => x.id === id), dd), { [k]: n }); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { fermer(); if (S.feuille) { S.feuille = null; render(); } return; }
  const a = document.activeElement; if (!a || /INPUT|SELECT|TEXTAREA/.test(a.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.getElementById('voile')) return;
  const row = a.closest && a.closest('[data-row]'); if (!row) return;
  const rows = [...document.querySelectorAll('[data-row]')], i = rows.indexOf(row);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = rows[i + (e.key === 'ArrowDown' ? 1 : -1)]; if (n) n.focus(); return; }
  const id = row.dataset.row, k = e.key.toLowerCase(), map = { l: 'p', a: 'a', c: 'cg', m: 'mal' };
  if (map[k]) { e.preventDefault(); setEtat(id, map[k]); S.focus = id; render(); }
  else if (k === 'r' || k === 'h') { e.preventDefault(); basculer(id, k === 'r' ? 'retard' : 'hs'); S.focus = id; render(); }
});
document.addEventListener('click', e => { if (e.target.id === 'voile') fermer(); });
initMoment();
render();
</script>
