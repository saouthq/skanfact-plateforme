# À chaque envoi : les types, le lint, les tests contre un vrai PostgreSQL, les preuves par
# réintroduction, et la recherche de secrets. Une construction rouge ne se contourne jamais
# (12 § 8) : on ne saute pas un test, on ne le met pas de côté.
name: Vérifier

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Les tests, sur deux Node, chacun en deux moitiés sur deux machines (décidé par Skander le 05/10/2026 : une
  # modification doit arriver sur le serveur sans attendre une heure) : tous les tests, en deux fois moins de temps.
  verifier:
    name: Tests (Node ${{ matrix.node }}, moitié ${{ matrix.moitie }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        moitie: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Une base jetable, qui n'existe que le temps de la vérification : ce n'est pas un secret.
      PG_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Le navigateur des tests des écrans
        run: npx playwright-core install --with-deps chromium
      # La coque de bureau (brique 137, tests/bureau/coque.test.ts) : le programme Electron, et un écran virtuel (Xvfb)
      # qu'elle démarre elle-même ; sans écran, Electron ne dessine pas le ticket.
      - name: Electron (la coque de bureau)
        run: node node_modules/electron/install.js
      # xmllint relit chaque fichier El Fatoora contre le schéma de la TTN (tests/v10/efacture.test.ts) ;
      # sans lui, le test tombe (il ne saute jamais le schéma). Tesseract (avec le français) et Poppler
      # lisent les factures d'achat en photo ou en PDF (brique 84, tests/achats) : les mêmes que sur le serveur.
      - name: xmllint, Tesseract, Poppler et Xvfb (la facture électronique, la lecture des factures d'achat, la coque de bureau)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils tesseract-ocr tesseract-ocr-fra poppler-utils xvfb
      - name: Types
        run: npm run types
      - name: Lint (0 erreur, 0 avertissement)
        run: npm run lint
      - name: Tests
        run: npm test -- --shard=${{ matrix.moitie }}/2

  # Les preuves par réintroduction de CE changement (décidé par Skander le 05/10/2026 : en développement, une
  # modification arrive sur le serveur d'essai en une dizaine de minutes, pas en une heure) : les preuves nouvelles
  # ou changées, et celles dont le fichier visé a changé depuis la version d'avant (tests/preuves-du-changement.sh),
  # sur six machines. TOUTES les preuves tournent chaque nuit et avant la production (preuves-completes.yml).
  preuves:
    name: Preuves du changement (${{ matrix.groupe }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        groupe: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Les preuves concernées
        env:
          AVANT: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          # Un premier envoi de branche n'a pas de « version d'avant » : on prend le commit parent.
          if [ -z "$AVANT" ] || ! git cat-file -e "$AVANT^{commit}" 2>/dev/null; then AVANT=$(git rev-parse HEAD~1); fi
          BASE="$AVANT" bash tests/preuves-du-changement.sh "$RUNNER_TEMP/noms.txt"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Le navigateur des tests des écrans
        run: npx playwright-core install --with-deps chromium
      - name: Electron (la coque de bureau)
        run: node node_modules/electron/install.js
      # Sans xmllint (ou sans Tesseract et Poppler), les tests de la facture électronique (ou de la lecture
      # des factures d'achat) tomberaient pour une autre raison que le défaut remis : la preuve ne prouverait rien.
      - name: xmllint, Tesseract, Poppler et Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils tesseract-ocr tesseract-ocr-fra poppler-utils xvfb
      - name: Preuves (chaque test tombe quand on remet son défaut)
        run: npm run preuves
        env:
          NOMS: ${{ runner.temp }}/noms.txt
          PARTIE: ${{ matrix.groupe }}/6

  # Le contrôle éclair (quelques secondes) : chaque preuve vise un endroit qui existe une fois, pas une
  # définition qu'une migration plus récente remplace ; le bilan reste à la fin de tests/preuves.sh ; un défaut
  # posé dans un écran n'en casse pas la syntaxe (il lit l'écran avec le lecteur de la construction : d'où npm ci).
  preuves-eclair:
    name: Preuves (contrôle éclair)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash tests/verif-preuves.sh

  secrets:
    name: Aucun secret dans le dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
