# À chaque envoi : les types, le lint, les tests contre un vrai PostgreSQL, les preuves par
# réintroduction, et la recherche de secrets. Une construction rouge ne se contourne jamais
# (12 § 8) : on ne saute pas un test, on ne le met pas de côté.
name: Vérifier

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Une base jetable, qui n'existe que le temps de la vérification : ce n'est pas un secret.
      PG_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Le navigateur des tests des écrans
        run: npx playwright-core install --with-deps chromium
      # xmllint relit chaque fichier El Fatoora contre le schéma de la TTN (tests/v10/efacture.test.ts) ;
      # sans lui, le test tombe (il ne saute jamais le schéma). Tesseract (avec le français) et Poppler
      # lisent les factures d'achat en photo ou en PDF (brique 84, tests/achats) : les mêmes que sur le serveur.
      - name: xmllint, Tesseract et Poppler (la facture électronique, la lecture des factures d'achat)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils tesseract-ocr tesseract-ocr-fra poppler-utils
      - name: Types
        run: npm run types
      - name: Lint (0 erreur, 0 avertissement)
        run: npm run lint
      - name: Tests
        run: npm test

  # Les preuves par réintroduction, en quatre groupes sur quatre machines qui tournent en même temps
  # (une preuve sur quatre chacune) : toutes les preuves, en un quart du temps. Un seul groupe qui ne
  # prouve pas tout fait échouer la vérification.
  preuves:
    name: Preuves (groupe ${{ matrix.groupe }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        groupe: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Le navigateur des tests des écrans
        run: npx playwright-core install --with-deps chromium
      # Sans xmllint (ou sans Tesseract et Poppler), les tests de la facture électronique (ou de la lecture
      # des factures d'achat) tomberaient pour une autre raison que le défaut remis : la preuve ne prouverait rien.
      - name: xmllint, Tesseract et Poppler (la facture électronique, la lecture des factures d'achat)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils tesseract-ocr tesseract-ocr-fra poppler-utils
      - name: Preuves (chaque test tombe quand on remet son défaut)
        run: npm run preuves
        env:
          PARTIE: ${{ matrix.groupe }}/4

  # Le contrôle éclair (quelques secondes) : chaque preuve vise un endroit qui existe une fois, pas une
  # définition qu'une migration plus récente remplace ; le bilan reste à la fin de tests/preuves.sh.
  preuves-eclair:
    name: Preuves (contrôle éclair)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tests/verif-preuves.sh

  secrets:
    name: Aucun secret dans le dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
