<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self' data: blob:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkanFact</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="../plateforme/telephone.css">
  <link rel="stylesheet" href="../plateforme/caisse.css">
  <link rel="stylesheet" href="../plateforme/ecrans.css">
  <script src="../tiers/qrcode.js"></script>
  <script src="../plateforme/qr.js"></script>
  <script src="../plateforme/virgule.js"></script>
  <script src="../plateforme/dates.js"></script>
  <script src="../plateforme/poste.js"></script>
  <script src="../plateforme/tableur.js"></script>
  <script src="../plateforme/pont.js"></script>
  <script src="../plateforme/compte.js"></script>
  <link rel="stylesheet" href="../plateforme/compte.css">
  <script src="../plateforme/equipe.js"></script>
  <link rel="stylesheet" href="../plateforme/equipe.css">
  <script src="../plateforme/abonnement.js"></script>
  <link rel="stylesheet" href="../plateforme/abonnement.css">
  <script src="../plateforme/message.js"></script>
  <link rel="stylesheet" href="../plateforme/message.css">
  <script src="../plateforme/support.js"></script>
  <link rel="stylesheet" href="../plateforme/support.css">
  <script src="../plateforme/acces.js"></script>
  <link rel="stylesheet" href="../plateforme/acces.css">
  <script src="../plateforme/assistant.js"></script>
  <link rel="stylesheet" href="../plateforme/assistant.css">
  <script src="../plateforme/premiers-pas.js"></script>
  <link rel="stylesheet" href="../plateforme/premiers-pas.css">
  <script src="../plateforme/messagerie.js"></script>
  <link rel="stylesheet" href="../plateforme/messagerie.css">
  <script src="../plateforme/telephone.js"></script>
  <link rel="stylesheet" href="../plateforme/barre.css">
  <link rel="stylesheet" href="../plateforme/charte.css">
  <link rel="stylesheet" href="../plateforme/liste.css">
  <link rel="stylesheet" href="../plateforme/piece.css">
  <script src="../plateforme/barre.js"></script>
</head>
<body>
  <div id="app">
    <!-- La barre (maquette « Barre v3 », 26/10/2026 ; docs/maquettes-appliquees.md) : l'entreprise et la cloche, « Créer »
         et la recherche, puis « Au quotidien » et « Tout le reste » (dessinés par drawNav et plateforme/barre.js), et le
         pied : la mise à jour, l'abonnement, la personne et ses trois boutons. Les identifiants que le reste du code
         emploie (brand-btn, brand-company, dos-menu, nav-search, nav, lic-banner, update-pill, app-version,
         foot-comptable, nav-support) sont gardés. -->
    <aside class="sidebar barre" id="barre">
      <div class="tete-barre">
        <div class="brand-wrap">
          <button class="brand marque" id="brand-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="Changer d'entreprise">
            <span class="brand-mark marque-s" aria-hidden="true">SF</span>
            <span class="brand-txt marque-nom"><b class="brand-sub" id="brand-company">—</b><span id="brand-metier"></span><span class="beta-tag" id="beta-tag" hidden>bêta</span></span>
            <span class="chev" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg></span>
          </button>
          <div class="dos-menu pop" id="dos-menu" role="menu" hidden></div>
        </div>
        <button type="button" class="cloche" id="b-cloche" aria-label="Nouvelles" aria-haspopup="dialog" aria-expanded="false" data-tip="Nouvelles"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg><span class="pt" hidden></span></button>
      </div>
      <div class="hors" id="b-hors" hidden></div>
      <div class="haut-barre" id="zone-creer">
        <button type="button" class="btn-creer" id="b-creer" aria-haspopup="menu" aria-expanded="false" data-tip="Créer · N"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="lib">Créer</span><kbd>N</kbd></button>
        <button class="nav-search champ-barre" id="nav-search" type="button" aria-label="Rechercher (Ctrl K)" data-tip="Rechercher · Ctrl K">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
          <span class="lib">Rechercher…</span><kbd id="nav-search-k">Ctrl K</kbd>
        </button>
      </div>
      <div class="barre-milieu">
        <nav id="nav" aria-label="Navigation principale"><noscript><a href="#/dashboard">Accueil</a> · <a href="#/factures">Factures</a> · <a href="#/aide">Aide</a></noscript></nav>
      </div>
      <div class="sidebar-foot pied-bas">
        <button type="button" class="update-pill" id="update-pill" hidden></button>
        <button type="button" class="maj" id="b-maj" hidden><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></span><span class="lib">Mise à jour prête</span><u>Recharger</u></button>
        <button type="button" class="abo" id="lic-banner" hidden></button>
        <!-- « Mon comptable » et « Tous les modules » : posés ici, drawNav les range dans la liste (cachés jusque-là : au rechargement, « Ajouter un module » apparaissait en bas, 26/10/2026). -->
        <a href="#/comptable" data-route="comptable" class="foot-link lien" id="foot-comptable" data-tip="Mon comptable" hidden><span class="ic"><svg viewBox="0 0 24 24"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 12.5h5"/></svg></span>Mon comptable<span class="nav-count compte" id="nav-comptable" hidden></span><span class="point"></span></a>
        <a href="#/modules" data-route="modules" class="foot-link lien" id="foot-modules" data-tip="Ajouter un module" hidden><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M17 13v8M13 17h8"/></svg></span>Ajouter un module</a>
        <div class="pied-liens">
          <button type="button" class="moi" id="b-moi" aria-haspopup="menu" aria-expanded="false"><span class="avatar" aria-hidden="true"></span><span class="moi-nom"><b></b><span></span></span></button>
          <a href="#/parametres" data-route="parametres" class="foot-link btn-icone" aria-label="Paramètres" title="Paramètres"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></a>
          <a href="#/guide" data-route="guide" class="foot-link btn-icone" aria-label="Me guider" title="Me guider : la visite guidée de la page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg></a>
          <a href="#/aide" data-route="aide" class="foot-link btn-icone" aria-label="Aide" title="Aide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.3-2.4 3.6M12 17.2h.01"/></svg><span class="nav-count pt-aide" id="nav-support" hidden></span></a>
        </div>
        <div class="app-version" id="app-version" hidden></div>
      </div>
      <button type="button" class="replier" id="b-replier" aria-label="Replier la barre" title="Replier la barre ( [ )"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg></button>
    </aside>
    <main id="view"></main>
  </div>

  <div id="palette-root" hidden></div>
  <div id="modal-root"></div>
  <div id="toast"></div>

  <!-- Le moteur comptable, partagé avec l'application du cabinet (9.1.0). Il se charge AVANT
       core.js, qui en réexporte `entriesBalance` et `entriesByAccount` : l'inverse laisserait
       `root.SkanCompta` indéfini au moment où core.js le lit, sans rien afficher en console. -->
  <script src="compta.js"></script>
  <script src="core.js"></script>
  <script src="teif.js"></script>
  <script src="demo.js"></script>
  <script src="guide.js"></script>
  <script src="onboarding.js"></script>
  <!-- Le menu d'actions d'une ligne, partagé avec l'application du cabinet (voir rowmenu.js). -->
  <script src="rowmenu.js"></script>
  <script src="listes.js"></script>
  <script src="placement.js"></script>
  <!-- Le sommaire et la recherche des pages de réglages, partagés eux aussi (voir reglages.js). -->
  <script src="reglages.js"></script>
  <!-- L'écran des mises à jour, le même dans les deux applications (voir majui.js). -->
  <script src="majui.js"></script>
  <script src="nouveautes.js"></script>
  <!-- La visite guidée (10.14.0) : le moteur, sans métier, puis le contenu de cette application. -->
  <script src="visite.js"></script>
  <script src="visites.js"></script>
  <script src="app.js"></script>
</body>
</html>
