<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkanFact Cabinet</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="cabinet.css">
  <link rel="stylesheet" href="../../plateforme/cabinet.css">
  <link rel="stylesheet" href="../../plateforme/telephone.css">
  <script src="../../plateforme/telephone.js"></script>
  <link rel="stylesheet" href="../../plateforme/barre.css">
  <link rel="stylesheet" href="../../plateforme/barre-cabinet.css">
  <link rel="stylesheet" href="../../plateforme/charte.css">
  <script src="../../plateforme/barre.js"></script>
</head>
<body>
  <div id="app" hidden>
    <!-- La barre du Cabinet (maquette « Barre v3 », lot 1 b, 26/10/2026 ; docs/maquettes-appliquees.md) : la marque du cabinet
         et la cloche, « Créer » (dans le dossier ouvert) et la recherche, puis « Mon cabinet » (tous les dossiers) et le
         dossier ouvert (dessinés par drawNav et plateforme/barre.js), et le pied : la mise à jour, l'abonnement, la personne
         et ses trois boutons. Les identifiants que le reste du code emploie (brand-cab, nav-messages, nav-relances,
         upd-pill, lic-banner, se-deconnecter, app-version) sont gardés. -->
    <aside class="sidebar barre" id="barre">
      <div class="tete-barre">
        <div class="brand-wrap">
          <button class="brand marque" id="brand-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="Le menu du cabinet">
            <span class="brand-mark marque-s cab" aria-hidden="true">SF</span>
            <span class="brand-txt marque-nom"><b class="brand-sub" id="brand-cab">—</b><span id="brand-cab-sous">Cabinet</span></span>
            <span class="chev" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg></span>
          </button>
        </div>
        <button type="button" class="cloche" id="b-cloche" aria-label="Nouvelles" aria-haspopup="dialog" aria-expanded="false" data-tip="Nouvelles"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg><span class="pt" hidden></span></button>
      </div>
      <div class="hors" id="b-hors" hidden></div>
      <div class="haut-barre" id="zone-creer">
        <button type="button" class="btn-creer" id="b-creer" aria-haspopup="menu" aria-expanded="false" data-tip="Créer · N"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="lib">Créer</span><kbd>N</kbd></button>
        <button class="nav-search champ-barre" id="nav-search" type="button" aria-label="Rechercher (Ctrl K)" data-tip="Rechercher · Ctrl K">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
          <span class="lib">Rechercher…</span><kbd>Ctrl K</kbd>
        </button>
      </div>
      <div class="barre-milieu">
        <nav id="nav" aria-label="Navigation du cabinet"><noscript><a href="#/priorites">Priorités</a> · <a href="#/dossiers">Dossiers</a> · <a href="#/aide">Aide</a></noscript></nav>
      </div>
      <div class="sidebar-foot pied-bas">
        <button type="button" class="update-pill" id="upd-pill" hidden></button>
        <button type="button" class="maj" id="b-maj" hidden><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></span><span class="lib">Mise à jour prête</span><u>Recharger</u></button>
        <button type="button" class="abo" id="lic-banner" hidden></button>
        <div class="pied-liens">
          <button type="button" class="moi" id="b-moi" aria-haspopup="menu" aria-expanded="false"><span class="avatar" aria-hidden="true"></span><span class="moi-nom"><b></b><span></span></span></button>
          <a href="#/reglages" data-route="reglages" class="foot-link btn-icone" aria-label="Réglages" title="Réglages du cabinet"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></a>
          <a href="#/guide" data-route="guide" class="foot-link btn-icone" aria-label="Me guider" title="Me guider : la visite guidée de la page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg></a>
          <a href="#/aide" data-route="aide" class="foot-link btn-icone" aria-label="Aide" title="Aide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.3-2.4 3.6M12 17.2h.01"/></svg></a>
        </div>
        <!-- « Se déconnecter » vit dans le menu de la personne ; ce bouton, caché, garde son geste (et ses tests). -->
        <button type="button" class="foot-link" id="se-deconnecter" hidden>Se déconnecter</button>
        <div class="app-version" id="app-version" hidden></div>
      </div>
      <button type="button" class="replier" id="b-replier" aria-label="Replier la barre" title="Replier la barre ( [ )"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg></button>
    </aside>
    <main id="view"></main>
  </div>

  <div id="lock-screen">
    <form class="lock-card" id="lock-form">
      <div class="brand-mark cab" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </div>
      <h2 id="lock-title">SkanFact Cabinet</h2>
      <p class="muted small" style="margin:0">L'application du comptable</p>
      <p class="muted small" id="lock-sub">Chargement…</p>
      <!-- Des champs sans étiquette font deviner. Un mot de passe qu'on ne peut pas relire fait
           taper trois fois. Et pas d'invite « •••••••• » (10.14.1) : un champ vide qui montre des
           points se lit comme un mot de passe déjà tapé, et l'on clique « Ouvrir » sur rien. -->
      <label class="field lock-field">Mot de passe
        <span class="pw-wrap">
          <input type="password" id="lock-pw" autocomplete="current-password">
          <button type="button" class="pw-eye" id="lock-eye" aria-label="Afficher le mot de passe">Afficher</button>
        </span>
      </label>
      <span class="muted small" id="lock-strength"></span>
      <label class="field lock-field" id="lock-pw2-wrap" hidden>Confirme le mot de passe
        <input type="password" id="lock-pw2" autocomplete="new-password">
      </label>
      <div class="lock-err" id="lock-err" hidden></div>
      <!-- L'avertissement AVANT le bouton, pas après : « il n'y a aucun moyen de récupérer ce mot
           de passe » se lisait sous « Créer mon cabinet », c'est-à-dire une fois le mot de passe
           choisi. Un refus, comme un avertissement, dit ce qu'il faut savoir avant d'agir. -->
      <p class="muted small lock-note" id="lock-note"></p>
      <button class="btn btn-primary" id="lock-go" type="submit">Ouvrir</button>
      <!-- Changer d'ordinateur n'avait aucun chemin : l'application disait « Bienvenue » et fabriquait
           une clé NEUVE à quelqu'un qui avait tout gardé. Le bouton est ici, sur le seul écran où il
           sert, et AVANT que la moindre clé existe. `type="button"` : il est dans un formulaire. -->
      <button class="btn btn-ghost btn-sm" id="lock-move" type="button">J'ai déjà un cabinet sur un autre ordinateur…</button>
    </form>
  </div>

  <!-- Le voile qui apparaît quand on fait glisser un paquet sur la fenêtre. -->
  <div id="drop-veil" hidden>
    <div class="drop-card">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
      <div class="drop-title">Lâche ici les paquets reçus</div>
      <div class="drop-sub">Les fichiers <code>.skanpack</code> que tes clients t'envoient chaque mois</div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast"></div>

  <!-- Le menu d'actions d'une ligne, partagé avec l'application entreprise. Elle a la même feuille
       de style : ce sont les mêmes classes `.row-menu…`, pas un second jeu qui dériverait. -->
  <script src="../../plateforme/dates.js"></script>
  <script src="../../plateforme/tableur.js"></script>
  <script src="../../plateforme/fec.js"></script>
  <script src="../../plateforme/poste.js"></script>
  <script src="../../plateforme/pont-cabinet.js"></script>
  <script src="../../tiers/qrcode.js"></script>
  <script src="../../plateforme/compte.js"></script>
  <link rel="stylesheet" href="../../plateforme/compte.css">
  <script src="../../plateforme/messagerie.js"></script>
  <script src="../../plateforme/apercu-pdf.js"></script>
  <link rel="stylesheet" href="../../plateforme/pieces-recues.css">
  <link rel="stylesheet" href="../../plateforme/echeances.css">
  <link rel="stylesheet" href="../../plateforme/liste.css">
  <link rel="stylesheet" href="../../plateforme/dossiers.css">
  <link rel="stylesheet" href="../../plateforme/messagerie.css">
  <script src="../../plateforme/abonnement-cabinet.js"></script>
  <link rel="stylesheet" href="../../plateforme/abonnement.css">
  <script src="../rowmenu.js"></script>
  <script src="../listes.js"></script>
  <script src="../placement.js"></script>
  <script src="../reglages.js"></script>
  <script src="../majui.js"></script>
  <script src="../nouveautes.js"></script>
  <!-- Le moteur comptable, le même que celui de l'application entreprise (9.1.0). C'est lui qui
       fait que la balance du cabinet est celle du client, au millime : deux calculs séparés
       auraient fini par diverger, et personne n'aurait su lequel croire. -->
  <script src="../compta.js"></script>
  <script src="cabcore.js"></script>
  <!-- La visite guidée (10.14.0) : le moteur partagé avec l'application entreprise, puis le contenu
       du Cabinet. -->
  <script src="../visite.js"></script>
  <script src="cabvisites.js"></script>
  <script src="cabguide.js"></script>
  <script src="app.js"></script>
</body>
</html>
